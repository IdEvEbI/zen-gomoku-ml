[project]
name = "zen-gomoku-ml"
version = "0.1.0"
description = "Gomoku imitation learning (AlphaZero-lite R2) for zen-gomoku"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "onnx>=1.16.0",
    "torch>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gomoku_ml"]
